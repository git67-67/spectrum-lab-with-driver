        c.beginPath(); let st = false; for (let i = 0; i < sr.x.length; i++) { const px = X(sr.x[i]), py = Y(ax, sr.y[i]); if (!isFinite(py)) { st = false; continue; } st ? c.lineTo(px, py) : c.moveTo(px, py); st = true; } c.stroke();
        if (sr.fill) { c.globalAlpha = 0.12; c.lineTo(X(sr.x[sr.x.length - 1]), PB); c.lineTo(X(sr.x[0]), PB); c.closePath(); c.fill(); }
        if (sr.pts || (sr.x.length < 60 && !sr.nopts)) { c.globalAlpha = sr.alpha || 1; for (let i = 0; i < sr.x.length; i++) { c.beginPath(); c.arc(X(sr.x[i]), Y(ax, sr.y[i]), 2.4, 0, 7); c.fill(); } }
      }
      c.globalAlpha = 1; c.setLineDash([]);
    }
    c.restore();
    /* markers (peak labels) */
    c.font = '11px system-ui,sans-serif'; c.textAlign = 'center'; let lastR = -1e9;
    for (const k of this.mk.slice().sort((a, b) => a.x - b.x)) {
      if (k.x < x0 || k.x > x1) continue; const px = X(k.x), py = Y('l', k.y), tw = c.measureText(k.text).width;
      c.fillStyle = T.fg; c.beginPath(); c.moveTo(px, py - 3); c.lineTo(px - 3.5, py - 9); c.lineTo(px + 3.5, py - 9); c.closePath(); c.fill();
      if (px - tw / 2 > lastR + 3 && py > PT + 20) { c.textBaseline = 'bottom'; c.fillText(k.text, Math.min(this.PR - tw / 2, Math.max(this.PL + tw / 2, px)), py - 10); lastR = px + tw / 2; }
    }
    /* selection + hover */
    if (this.sel) { c.fillStyle = T.acc; c.globalAlpha = 0.15; c.fillRect(this.sel[0], PT, this.sel[1] - this.sel[0], PB - PT); c.globalAlpha = 1; }
    if (this.hv != null && !this.sel) {
      const px = X(this.hv); c.strokeStyle = T.fg; c.globalAlpha = 0.45; c.beginPath(); c.moveTo(px, PT); c.lineTo(px, PB); c.stroke(); c.globalAlpha = 1;
      const rows = [(o.fmtX || String)(this.hv) + (o.unitX || '')];
      for (const sr of this.s) { if (sr.noscale && !sr.tip) continue; const v = this.interp(sr, this.hv); if (v == null) continue; const ax = sr.axis || 'l'; const col = sr.color === 'alt' ? T.alt : (sr.color || T.acc);
        c.fillStyle = col; c.beginPath(); c.arc(px, Y(ax, v), 3.5, 0, 7); c.fill(); rows.push((sr.name ? sr.name + ' ' : '') + fmtN(v) + (sr.unit ? ' ' + sr.unit : '')); }
      c.font = '11px system-ui,sans-serif'; const tw = Math.max(...rows.map(r => c.measureText(r).width)) + 12, th = rows.length * 14 + 6;
      let bx = px + 10; if (bx + tw > this.PR) bx = px - 10 - tw; if (bx < this.PL) bx = this.PL; const by = PT + 4;
      c.fillStyle = 'rgba(20,24,28,.88)'; c.fillRect(bx, by, tw, th); c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'top'; rows.forEach((r, i) => c.fillText(r, bx + 6, by + 3 + i * 14));
    }
    /* title */
    if (o.title) { c.fillStyle = T.muted; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText(typeof o.title === 'function' ? o.title() : o.title, this.PL + 4, PT + 1); }
    if (this.view) { c.fillStyle = T.muted; c.textAlign = 'right'; c.textBaseline = 'bottom'; c.fillText('zoomed · double-click to reset', this.PR - 4, PB - 3); }
  }
}
Plot.all = [];
root.I1ProPlot = { Plot, THEME, fmtN, niceTicks };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>window.I1P_VIEW="<style id=\"ms-css\">\n#view-meas .chip{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;color:var(--muted);white-space:nowrap}\n#view-meas .chip.ok{color:var(--accent);border-color:var(--accent)}\n#view-meas .chip.warn{color:var(--warn);border-color:var(--warn)}\n#view-meas .steps{display:flex;flex-direction:column;gap:8px;margin-top:12px}\n#view-meas .steps .st{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}\n#view-meas .btn.big{padding:10px 16px;font-size:15px}\n#view-meas .corrbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding:8px 10px;border:1px solid var(--line);border-radius:6px}\n#view-meas .corrbar.on{border-color:var(--accent)}\n#view-meas .sum{margin-top:10px;font-size:12.5px;color:var(--muted)}\n#view-meas .linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}\n#view-meas .tablewrap{max-height:420px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:6px}\n#view-meas table.mt{width:100%;border-collapse:collapse;font-size:12.5px}\n#view-meas table.mt th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--line);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}\n#view-meas table.mt td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}\n#view-meas table.mt tr.rw{cursor:pointer}\n#view-meas table.mt tr.rw:hover{background:var(--hover)}\n#view-meas table.mt tr.sel{background:var(--hover);box-shadow:inset 3px 0 0 var(--accent)}\n#view-meas table.mt .nm{font-weight:600;display:flex;gap:6px;align-items:center;min-width:0}\n#view-meas table.mt .nm span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}\n#view-meas table.mt .sub2{color:var(--muted);font-size:11.5px;margin-top:2px}\n#view-meas table.mt td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}\n#view-meas .dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}\n#view-meas .sw{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);flex:none;display:inline-block}\n#view-meas .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:6px}\n#view-meas .legend span{display:inline-flex;gap:5px;align-items:center}\n#view-meas .advhead{display:flex;align-items:center;justify-content:space-between;gap:8px}\n#view-meas details.sub{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}\n#view-meas input[type=text],#view-meas input[type=number],#view-meas select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0;max-width:100%}\n#view-meas .nameedit{width:100%;font:inherit;font-weight:600}\n<\/style>\n<div id=\"view-meas\">\n<div class=\"lab\">\n  <p class=\"intro\">Full instrument console: every calibration, resolution and kernel setting of the original i1 Pro tool. Measurements taken on the left of the measure page (and, with the box in Advanced settings ticked, those taken here) use these settings and go into the active group.<\/p>\n  <p class=\"note\" id=\"i1p-env\"><\/p>\n  <div class=\"mgrid\">\n    <section class=\"stage\">\n      <div class=\"mpanel\" id=\"ms-chartcard\">\n        <div class=\"toolbar\">\n          <h2 id=\"ms-title\" style=\"margin:0\">Spectrum<\/h2>\n          <div class=\"toolrow\">\n            <label class=\"chk\"><input type=\"checkbox\" id=\"ms-norm\"> Normalise peak to 1<\/label>\n            <label class=\"chk\"><input type=\"checkbox\" id=\"i1p-log10\"> Log axis<\/label>\n          <\/div>\n        <\/div>\n        <canvas id=\"i1p-cv\" aria-label=\"Measured spectra\" style=\"width:100%;height:260px;margin-top:8px\"><\/canvas>\n        <div class=\"row\" style=\"margin-top:2px\"><button class=\"btn sm\" data-z=\"S+\" aria-label=\"Zoom in\">\uff0b<\/button><button class=\"btn sm\" data-z=\"S-\" aria-label=\"Zoom out\">\u2212<\/button><button class=\"btn sm\" data-z=\"S0\">Reset zoom<\/button><span class=\"note\" style=\"margin:0\">Hover to read values \u00b7 drag to zoom a range \u00b7 double-click resets \u00b7 Ctrl+wheel zooms \u00b7 Shift+drag pans<\/span><\/div>\n        <div class=\"legend\" id=\"ms-legend\"><\/div>\n      <\/div>\n      <div class=\"mpanel detail\" id=\"ms-detail\"><\/div>\n      <div class=\"mpanel\" id=\"i1p-timecard\" hidden>\n        <div class=\"toolbar\"><h2 style=\"margin:0\">Over time<\/h2>\n          <div class=\"toolrow\"><label class=\"chk\">Plot A <select id=\"i1p-ma\"><\/select><\/label><label class=\"chk\">Plot B <select id=\"i1p-mb\"><\/select><\/label><\/div><\/div>\n        <canvas id=\"i1p-cvT\" aria-label=\"Metrics over time\" style=\"width:100%;height:200px;margin-top:8px\"><\/canvas>\n        <div class=\"row\"><button class=\"btn sm\" data-z=\"T+\">\uff0b<\/button><button class=\"btn sm\" data-z=\"T-\">\u2212<\/button><button class=\"btn sm\" data-z=\"T0\">Reset zoom<\/button><button class=\"btn sm\" id=\"i1p-logcsv\" disabled>History CSV<\/button><button class=\"btn sm\" id=\"i1p-histclear\">Clear history<\/button><\/div>\n        <div class=\"note\" id=\"i1p-log\" style=\"max-height:120px;overflow:auto;font-family:var(--mono);font-size:12px;white-space:pre;margin-top:6px\"><\/div>\n      <\/div>\n      <details class=\"mpanel sub\" id=\"ms-pixels\"><summary>Sensor pixels of the selected measurement<\/summary>\n        <canvas id=\"i1p-cv2\" aria-label=\"Raw sensor pixels\" style=\"width:100%;height:140px;margin-top:8px\"><\/canvas><\/details>\n    <\/section>\n\n    <aside class=\"mside\">\n      <div class=\"mside\" id=\"ms-main\">\n        <section class=\"mpanel\" id=\"i1p\">\n          <h2>Instrument<\/h2>\n          <div class=\"row\"><button class=\"btn primary\" id=\"i1p-connect\">Connect i1 Pro<\/button><button class=\"btn\" id=\"i1p-demo\">Try the demo (no hardware)<\/button><button class=\"btn\" id=\"i1p-disc\" hidden>Disconnect<\/button><\/div>\n          <div class=\"status\" id=\"i1p-status\" role=\"status\"><\/div>\n          <div id=\"i1p-ctl\" hidden>\n            <div class=\"seg\" role=\"group\" aria-label=\"What to measure\" style=\"margin-top:10px\"><button id=\"i1p-m-em\" aria-pressed=\"true\">Light<\/button><button id=\"i1p-m-rf\" aria-pressed=\"false\">Pigment<\/button><\/div>\n            <div class=\"steps\">\n              <div class=\"st\"><button class=\"btn\" id=\"i1p-dark\">1 \u00b7 Dark calibration<\/button><span class=\"chip\" id=\"i1p-darkst\">not done<\/span><\/div>\n              <div class=\"st\" id=\"i1p-whiterow\" hidden><button class=\"btn\" id=\"i1p-white\">2 \u00b7 White tile calibration<\/button><span class=\"chip\" id=\"i1p-whitest\">not done<\/span><\/div>\n              <div class=\"st\"><button class=\"btn primary big\" id=\"i1p-meas\">Measure<\/button><button class=\"btn\" id=\"i1p-stop\" hidden>Stop<\/button><\/div>\n            <\/div>\n            <p class=\"note\" id=\"i1p-help\"><\/p>\n            <div class=\"field\"><label for=\"i1p-name\">Name <input type=\"text\" id=\"i1p-name\" placeholder=\"automatic (time)\"><\/label><\/div>\n            <div class=\"corrbar\" id=\"i1p-corrbar\">\n              <label class=\"chk\" style=\"color:var(--fg)\"><input type=\"checkbox\" id=\"i1p-ron\" disabled> Source (blackbody) correction<\/label>\n              <span class=\"chip\" id=\"i1p-rchip\">none<\/span>\n            <\/div>\n            <div class=\"corrbar\" id=\"i1p-abar\" style=\"margin-top:6px\">\n              <label class=\"chk\" style=\"color:var(--fg)\"><input type=\"checkbox\" id=\"i1p-aon\" disabled> Absolute level calibration<\/label>\n              <span class=\"chip\" id=\"i1p-achip\">none<\/span>\n            <\/div>\n            <div class=\"sum\" id=\"i1p-sum\"><\/div>\n            <div class=\"row\" style=\"margin-top:8px\"><button class=\"btn sm\" id=\"ms-adv-open\">Advanced settings\u2026<\/button><\/div>\n          <\/div>\n        <\/section>\n        <section class=\"mpanel\">\n          <div class=\"toolbar\"><h2 style=\"margin:0\">Measurements <span id=\"ms-count\" style=\"font-weight:400\"><\/span><\/h2><\/div>\n          <div class=\"tablewrap\" id=\"ms-wrap\"><table class=\"mt\" id=\"ms-table\"><thead><tr><th><input type=\"checkbox\" id=\"ms-all\" aria-label=\"Show all\"><\/th><th>Name<\/th><th style=\"text-align:right\">CCT<\/th><th style=\"text-align:right\">Y<\/th><th style=\"text-align:right\">Ra<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n          <p class=\"note\" id=\"ms-empty\">Nothing measured yet. Connect the instrument (or try the demo), calibrate the dark reference, and press Measure.<\/p>\n          <p class=\"note\" style=\"margin-top:6px\">Tick rows to show them in the chart; click a row for its details. Buttons below act on the ticked rows.<\/p>\n          <div class=\"row\">\n            <button class=\"btn sm\" id=\"ms-tolib\" title=\"Adds the ticked light measurements as shots to the active group\">Add to active group<\/button>\n            <select id=\"ms-export\" aria-label=\"Export\"><option value=\"\">Export\u2026<\/option><option value=\"csv\">Spectra, CSV (chosen resolution)<\/option><option value=\"argyll\">ArgyllCMS values, CSV (10 nm and 3.33 nm)<\/option><option value=\"sp\">.sp files (ArgyllCMS format)<\/option><option value=\"json\">Everything, JSON backup<\/option><\/select>\n            <button class=\"btn sm\" id=\"ms-del\">Delete<\/button><button class=\"btn sm\" id=\"ms-clear\">Clear all<\/button>\n          <\/div>\n          <div class=\"row\" style=\"margin-top:6px\"><button class=\"btn sm\" id=\"ms-load\">Load a backup\u2026<\/button><input type=\"file\" id=\"ms-loadfile\" accept=\".json\" hidden><\/div>\n          <div class=\"status\" id=\"ms-msg\" role=\"status\"><\/div>\n        <\/section>\n      <\/div>\n\n      <div class=\"mside\" id=\"ms-adv\" hidden>\n        <section class=\"mpanel\">\n          <div class=\"advhead\"><h2 style=\"margin:0\">Advanced settings<\/h2><button class=\"btn sm\" id=\"ms-adv-back\">\u2190 Back to measuring<\/button><\/div>\n          <p class=\"note\">Everything here is optional. The defaults give you the same numbers as <code>spotread<\/code>.<\/p>\n\n          <details class=\"sub\" id=\"i1p-d-exp\" open><summary>Exposure<\/summary>\n            <div class=\"field\"><label for=\"i1p-exm\">Exposure mode<\/label>\n              <select id=\"i1p-exm\"><option value=\"auto\">Auto (aim for a target signal)<\/option><option value=\"manual\">Manual integration time<\/option><\/select><\/div>\n            <div id=\"i1p-ex-auto\">\n              <div class=\"fgrid\">\n                <label>Target peak signal (CCD counts) <input type=\"number\" id=\"i1p-tgt\" value=\"40500\" min=\"3000\" max=\"54000\" step=\"500\"><\/label>\n                <label>Longest auto time (s) <input type=\"number\" id=\"i1p-maxauto\" value=\"2\" min=\"0.05\" max=\"4.4\" step=\"0.1\"><\/label>\n              <\/div>\n              <label class=\"chk\" style=\"margin-top:8px\"><input type=\"checkbox\" id=\"i1p-reuse\" checked> Reuse the exposure for repeat measurements<\/label>\n              <p class=\"note\" id=\"i1p-tgtnote\"><\/p>\n            <\/div>\n            <div id=\"i1p-ex-man\" hidden>\n              <div class=\"fgrid\"><label>Integration time (ms) <input type=\"number\" id=\"i1p-mt\" value=\"50\" min=\"4.7\" max=\"4456\" step=\"1\"><\/label><\/div>\n              <p class=\"note\" id=\"i1p-mtnote\"><\/p>\n            <\/div>\n            <div class=\"field\"><label for=\"i1p-rt\">Averaging time inside one reading (s) <input type=\"number\" id=\"i1p-rt\" value=\"1\" min=\"0.05\" max=\"10\" step=\"0.05\"><\/label><\/div>\n          <\/details>\n\n          <details class=\"sub\" id=\"i1p-d-res\" open><summary>Resolution and output<\/summary>\n            <div class=\"field\"><label for=\"i1p-res\">Spectral resolution<\/label><select id=\"i1p-res\"><\/select><\/div>\n            <div id=\"i1p-custom\" hidden>\n              <div class=\"fgrid\">\n                <label>From nm <input type=\"number\" id=\"i1p-lo\" value=\"380\" step=\"1\"><\/label>\n                <label>to nm <input type=\"number\" id=\"i1p-hi\" value=\"730\" step=\"1\"><\/label>\n                <label>Step nm <input type=\"number\" id=\"i1p-step\" value=\"1\" min=\"0.1\" step=\"0.5\"><\/label>\n                <label>Kernel <select id=\"i1p-kern\"><option value=\"argyll\">ArgyllCMS (cubic interpolation + triangle)<\/option><option value=\"factory\">Factory (asymmetric Hann sinc)<\/option><option value=\"sinc\">Windowed sinc<\/option><option value=\"triangle\">Triangle<\/option><option value=\"gaussian\">Gaussian<\/option><\/select><\/label>\n                <label id=\"i1p-wscale-f\">Width \u00d7 <input type=\"number\" id=\"i1p-wscale\" value=\"1\" min=\"0.3\" max=\"2\" step=\"0.05\"><\/label>\n                <label id=\"i1p-fwhm-f\" hidden><span id=\"i1p-fwhm-l\">FWHM nm (0 = factory)<\/span> <input type=\"number\" id=\"i1p-fwhm\" value=\"0\" min=\"0\" step=\"0.5\"><\/label>\n                <label>Parameters between bands <select id=\"i1p-interp\"><option value=\"lagrange\">Cubic (Lagrange)<\/option><option value=\"linear\">Linear<\/option><\/select><\/label>\n              <\/div>\n            <\/div>\n            <p class=\"note\" id=\"i1p-resnote\"><\/p>\n            <div class=\"row\"><button class=\"btn sm\" id=\"i1p-kcmp\" title=\"Draws the selected measurement with five different kernels\">Compare kernels on the selected measurement<\/button><\/div><p class=\"note\" id=\"i1p-kcmpn\"><\/p>\n            <p class=\"note\"><b>The original ArgyllCMS values are always kept.<\/b> Every measurement stores the 10 nm bands and the 3.33 nm high-resolution values computed from the same pixels (the factory 36-band output and the ArgyllCMS high-resolution grid), plus the 128 raw pixel values, whatever resolution or kernel you display or export. The 128 pixels are not on an even wavelength grid and each one responds to a range of wavelengths; the raw pixels are the only true measured data.<\/p>\n          <\/details>\n\n          <details class=\"sub\" id=\"i1p-d-live\"><summary>Live recording and averaging<\/summary>\n            <div class=\"row\" style=\"margin-top:6px\"><button class=\"btn primary\" id=\"i1p-live\">\u25b6 Start live recording<\/button><span class=\"note\" id=\"i1p-livenote\" style=\"margin:0\"><\/span><\/div>\n            <div class=\"fgrid\">\n              <label>Reading time per update (s) <input type=\"number\" id=\"i1p-lrt\" value=\"0.2\" min=\"0.02\" max=\"5\" step=\"0.05\"><\/label>\n              <label>Averaging <select id=\"i1p-am\"><option value=\"none\">None (each reading)<\/option><option value=\"roll\" selected>Rolling mean<\/option><option value=\"cum\">Cumulative mean<\/option><\/select><\/label>\n              <label id=\"i1p-wn-f\">Rolling window (readings) <input type=\"number\" id=\"i1p-wn\" value=\"5\" min=\"2\" max=\"200\" step=\"1\"><\/label>\n              <label>Keep last (points) <input type=\"number\" id=\"i1p-keep\" value=\"600\" min=\"20\" max=\"5000\" step=\"20\"><\/label>\n            <\/div>\n            <label class=\"chk\" style=\"margin-top:8px\"><input type=\"checkbox\" id=\"i1p-livesnap\" checked> Add the averaged spectrum to the table when I stop<\/label>\n            <div class=\"row\" style=\"margin-top:6px\"><button class=\"btn sm\" id=\"i1p-avgreset\">Restart averaging<\/button><button class=\"btn sm\" id=\"i1p-snap\" disabled>Add current to table<\/button><\/div>\n            <p class=\"note\">Live keeps measuring with the exposure it found, shows every update and the running average, and plots brightness, CCT, Duv, CRI, TM-30 \u2026 over time (card on the left). A short reading time updates faster but is noisier; the rolling mean brings the noise back down.<\/p>\n            <hr>\n            <p class=\"note\"><b>Fixed number of readings<\/b> for the Measure button (1 = a single reading; the mean goes into the table).<\/p>\n            <div class=\"fgrid\">\n              <label>Number of readings (0 = until Stop) <input type=\"number\" id=\"i1p-n\" value=\"1\" min=\"0\" max=\"500\" step=\"1\"><\/label>\n              <label>Interval (s, start to start) <input type=\"number\" id=\"i1p-int\" value=\"0\" min=\"0\" step=\"0.5\"><\/label>\n            <\/div>\n            <label class=\"chk\" style=\"margin-top:8px\"><input type=\"checkbox\" id=\"i1p-each\"> Also keep every single reading as its own row<\/label>\n          <\/details>\n\n          <details class=\"sub\" id=\"i1p-d-src\"><summary>Calibrate against a known source (blackbody)<\/summary>\n            <p class=\"note\">Measure a lamp whose spectrum you know (a tungsten halogen or incandescent lamp at a known colour temperature). The page derives a per-band multiplier so the instrument shows that source's shape, and applies it to every following light measurement while the switch \"Source (blackbody) correction\" is on. It does not change the absolute level.<\/p>\n            <div class=\"fgrid\">\n              <label>Reference <select id=\"i1p-rk\"><option value=\"blackbody\">Ideal blackbody<\/option><option value=\"tungsten\">Tungsten filament (approximate)<\/option><option value=\"custom\">Custom CSV (wavelength,value)<\/option><\/select><\/label>\n              <label>Temperature (K) <input type=\"number\" id=\"i1p-rT\" value=\"2856\" min=\"1500\" max=\"10000\" step=\"10\"><\/label>\n            <\/div>\n            <div class=\"row\" style=\"margin-top:8px\"><input type=\"file\" id=\"i1p-rfile\" accept=\".csv,.txt\" hidden><button class=\"btn sm\" id=\"i1p-rload\" hidden>Load reference CSV\u2026<\/button>\n              <button class=\"btn sm\" id=\"i1p-rcal\">Measure and calibrate<\/button><button class=\"btn sm\" id=\"i1p-rclr\" disabled>Clear<\/button>\n              <button class=\"btn sm\" id=\"i1p-rsave\" disabled>Save profile<\/button><button class=\"btn sm\" id=\"i1p-rload2\">Load profile<\/button><input type=\"file\" id=\"i1p-rpf\" accept=\".json\" hidden><\/div>\n            <canvas id=\"i1p-cv4\" aria-label=\"Correction\" style=\"width:100%;height:80px;margin-top:8px\"><\/canvas>\n            <div class=\"note\" id=\"i1p-rinfo\"><\/div>\n          <\/details>\n\n          <details class=\"sub\" id=\"i1p-d-abs\"><summary>Calibrate the absolute level (brightness / power)<\/summary>\n            <p class=\"note\">The factory scale is assumed to be mW/m\u00b2/nm and has not been checked against a reference. Here you can scale every\n              following light measurement so that a source of known level reads correctly. This is one factor for the whole spectrum\n              (the spectral <i>shape<\/i> is handled by the blackbody correction above). Measure the reference with the same exposure\n              settings and geometry you will use later.<\/p>\n            <div class=\"fgrid\">\n              <label>Reference <select id=\"i1p-ak\"><option value=\"lum\">Known brightness (cd/m\u00b2), e.g. a display checked with a luminance meter<\/option><option value=\"irr\">Known radiant power per area (mW/m\u00b2, 380-780 nm)<\/option><option value=\"laser\">Laser line of known power<\/option><option value=\"man\">Enter the factor directly<\/option><\/select><\/label>\n              <label id=\"i1p-av-f\">Known value <input type=\"number\" id=\"i1p-av\" value=\"100\" min=\"0\" step=\"any\"><\/label>\n              <label id=\"i1p-al-f\" hidden>Laser power (mW) <input type=\"number\" id=\"i1p-ap\" value=\"1\" min=\"0\" step=\"any\"><\/label>\n              <label id=\"i1p-aw-f\" hidden>Laser wavelength (nm, 0 = strongest peak) <input type=\"number\" id=\"i1p-aw\" value=\"0\" min=\"0\" max=\"800\" step=\"0.1\"><\/label>\n              <label id=\"i1p-ah-f\" hidden>Integrate \u00b1 nm around it <input type=\"number\" id=\"i1p-ah\" value=\"15\" min=\"3\" max=\"100\" step=\"1\"><\/label>\n              <label id=\"i1p-aa-f\" hidden>Beam area on the sensor (mm\u00b2, blank = unknown) <input type=\"number\" id=\"i1p-aa\" value=\"\" min=\"0\" step=\"any\"><\/label>\n              <label id=\"i1p-am2-f\" hidden>Factor <input type=\"number\" id=\"i1p-am2\" value=\"1\" min=\"0\" step=\"any\"><\/label>\n            <\/div>\n            <p class=\"note\" id=\"i1p-anote\"><\/p>\n            <div class=\"row\" style=\"margin-top:8px\"><button class=\"btn sm\" id=\"i1p-acal\">Measure and calibrate<\/button><button class=\"btn sm\" id=\"i1p-aclr\" disabled>Clear<\/button><\/div>\n            <div class=\"note\" id=\"i1p-ainfo\"><\/div>\n          <\/details>\n\n          <details class=\"sub\" id=\"i1p-d-bb\"><summary>Blackbody at several temperatures (find the true temperature)<\/summary>\n            <p class=\"note\">Use a lamp whose temperature you can change (supply voltage or current) and whose true temperature you do not know exactly.\n              Set a temperature, press <b>Add this temperature<\/b>, change the lamp, repeat (at least 3 steps, as far apart as you can).\n              Steps in temperature are determined from the data alone, whatever the instrument's colour response or the filament's\n              emissivity. The <b>absolute<\/b> temperature needs one more fact: the true temperature of one step (pyrometer, or the filament\n              resistance of a tungsten lamp). Without it the factory colour calibration and a grey emitter are trusted.<\/p>\n            <div class=\"row\"><label>Your estimate (K, optional) <input type=\"number\" id=\"i1p-bt\" value=\"\" min=\"1000\" max=\"10000\" step=\"10\" style=\"width:90px\"><\/label>\n              <button class=\"btn sm\" id=\"i1p-badd\">Add this temperature<\/button><button class=\"btn sm\" id=\"i1p-bclr\" disabled>Clear list<\/button><\/div>\n            <div class=\"tablewrap\" style=\"max-height:200px\"><table class=\"mt\" id=\"i1p-btab\"><thead><tr><th>#<\/th><th>Estimate<\/th><th>Peak counts<\/th><th>Fitted T<\/th><th>Anchor<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n            <div class=\"fgrid\" style=\"margin-top:8px\">\n              <label>Anchor: known true temperature of the selected step (K, blank = none) <input type=\"number\" id=\"i1p-ban\" value=\"\" min=\"1000\" max=\"10000\" step=\"1\"><\/label>\n              <label>Selected step <select id=\"i1p-bas\"><\/select><\/label>\n              <label>Fit range from (nm) <input type=\"number\" id=\"i1p-blo\" value=\"430\" min=\"380\" max=\"700\" step=\"10\"><\/label>\n              <label>to (nm) <input type=\"number\" id=\"i1p-bhi\" value=\"710\" min=\"420\" max=\"730\" step=\"10\"><\/label>\n            <\/div>\n            <div class=\"row\" style=\"margin-top:8px\"><button class=\"btn sm\" id=\"i1p-bfit\" disabled>Fit temperatures<\/button><button class=\"btn sm\" id=\"i1p-buse\" disabled>Use as source correction<\/button><\/div>\n            <div class=\"note\" id=\"i1p-binfo\"><\/div>\n          <\/details>\n\n          <details class=\"sub\" id=\"i1p-d-ee\"><summary>Calibration data (EEPROM)<\/summary>\n            <p class=\"note\">The factory calibration lives in the instrument's EEPROM and is read from it when you connect. Back it up, or load another one (a .bin, a hex dump, or the \"-D9\" output of spotread). A loaded file replaces the wavelength matrix, linearisation and white tile data used here; the dark and white calibrations must then be redone. Nothing is written to the instrument.<\/p>\n            <div class=\"row\"><button class=\"btn sm\" id=\"i1p-eebin\">Backup .bin<\/button><button class=\"btn sm\" id=\"i1p-eehex\">Backup hex<\/button>\n              <button class=\"btn sm\" id=\"i1p-eeload\">Import\u2026<\/button><input type=\"file\" id=\"i1p-eefile\" hidden>\n              <button class=\"btn sm\" id=\"i1p-eereset\" disabled>Back to the instrument's own<\/button><\/div>\n            <div class=\"note\" id=\"i1p-eeinfo\"><\/div>\n          <\/details>\n\n          <details class=\"sub\" id=\"i1p-d-disp\"><summary>Readout and display<\/summary>\n            <div class=\"fgrid\">\n              <label>Peak labels (max) <input type=\"number\" id=\"i1p-pkn\" value=\"6\" min=\"0\" max=\"12\" step=\"1\"><\/label>\n              <label>Peak prominence (% of max) <input type=\"number\" id=\"i1p-pkp\" value=\"8\" min=\"1\" max=\"60\" step=\"1\"><\/label>\n              <label class=\"chk\"><input type=\"checkbox\" id=\"i1p-pkv\"> Also label valleys (\u25be)<\/label>\n            <\/div>\n            <label class=\"chk\" style=\"margin-top:8px\"><input type=\"checkbox\" id=\"i1p-inst\"> In live mode also draw the latest single reading<\/label>\n            <label class=\"chk\"><input type=\"checkbox\" id=\"i1p-btn\" checked> The instrument's button also measures<\/label>\n            <label class=\"chk\"><input type=\"checkbox\" id=\"i1p-auto\" checked> Also add every measurement made here to the active group of the lab<\/label>\n            <p class=\"note\">Brightness and power are computed from the factory-calibrated spectrum, which the instrument reports in mW/m\u00b2/nm. Luminance = 683 lm/W \u00d7 the Y-weighted integral, so it is in cd/m\u00b2 for a light that fills the instrument's view and lux behind a diffuser. The calibration factor lets you match a trusted meter: set it to (their value) \u00f7 (value shown here). Not yet checked against a reference meter for every unit. The calibration factor applies to measurements from now on.<\/p>\n          <\/details>\n\n          <details class=\"sub\" id=\"i1p-d-info\"><summary>Instrument info and diagnostics<\/summary>\n            <div class=\"readout\" id=\"i1p-info\" style=\"grid-template-columns:repeat(2,minmax(0,1fr))\"><\/div>\n            <label class=\"chk\" style=\"margin-top:8px\"><input type=\"checkbox\" id=\"i1p-autorec\" checked> Reset and retry once automatically after a timeout<\/label>\n            <div class=\"row\" style=\"margin-top:6px\"><button class=\"btn sm\" id=\"i1p-diag\">Copy diagnostic log<\/button><button class=\"btn sm\" id=\"i1p-diagsave\">Save log<\/button><\/div>\n            <p class=\"note\">If you see \"Instrument did not answer (timeout)\": the page resets the instrument and retries once by itself. If it keeps happening, plug the i1 Pro directly into the computer (not a hub), close other programs that use it, keep this tab in the foreground, and send the diagnostic log with your report.<\/p>\n            <div class=\"note\" id=\"i1p-diagmsg\"><\/div>\n          <\/details>\n        <\/section>\n        <section class=\"mpanel\"><details class=\"sub\" style=\"border:0;margin:0;padding:0\"><summary>Linux setup<\/summary>\n          <p class=\"note\">One-time udev rule so the browser may open the instrument (run as root, then re-plug it):<\/p>\n          <textarea readonly rows=\"3\" style=\"width:100%;font-family:var(--mono);font-size:12px\" aria-label=\"udev rule\">SUBSYSTEM==\"usb\", ATTR{idVendor}==\"0971\", ATTR{idProduct}==\"2000\", MODE=\"0660\", TAG+=\"uaccess\"<\/textarea>\n          <p class=\"note\">Save as /etc/udev/rules.d/55-i1pro.rules, then <code>sudo udevadm control --reload &amp;&amp; sudo udevadm trigger<\/code>. Close spotread before connecting; the page must be opened over https:// (or as a local file) in Chrome or Edge.<\/p>\n        <\/details><\/section>\n      <\/div>\n    <\/aside>\n  <\/div>\n<\/div>\n<\/div>\n";
</script>
<script>/* i1pro-ui.js - the "Measure" tab: connect an i1 Pro, calibrate, measure, and manage the measurements in a table.
   Needs i1pro-core.js (I1Pro), i1pro-plot.js (I1ProPlot), optionally i1pro-sim.js (I1ProSim, demo mode), and the host page's own
   functions: ledMake / ledPut / cleanLED / ledChanged / ledSaveSoon / ldSelect (illuminant library), setKind / addFilter / usSaveSoon /
   recompute / showTab / st (colour map and pigments), CMF_TAB, kvOpen / kvPut (storage). */
window.I1P_boot = function () {
  'use strict';
  const g = id => document.getElementById(id);
  const root = g('view-meas'); if (!root) return;
  const { Plot, fmtN, THEME } = window.I1ProPlot;
  let dev = null, sim = null, busy = false, liveOn = false, stopFlag = false, pendingBtn = false, mode = 'em', colorN = 0, seq = 0;
  let origEE = null, srcMeta = null, userRef = null, live = null, hist = [];
  const MS = { list: [], sel: null, checked: new Set() }, EE = {}, calCache = new Map();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = (id, d) => { const v = parseFloat(g(id).value); return isFinite(v) ? v : d; };
  const kv = (k, v) => '<div class="kv"><span>' + k + '</span><b>' + v + '</b></div>';
  const lstore = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
  const sig = (a, d) => Array.from(a, x => +(+x).toPrecision(d || 7));
  function download(name, data, type) {
    const a = document.createElement('a'), u = URL.createObjectURL(new Blob([data], { type: type || 'application/octet-stream' }));
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000);
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const timeStr = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const ago = t => { const s = (Date.now() - t) / 1000; return s < 90 ? Math.round(s) + ' s ago' : Math.round(s / 60) + ' min ago'; };

  /* ---------- environment, status ---------- */
  const envEl = g('i1p-env');
  if (!I1Pro.WebUSBTransport.supported()) envEl.innerHTML = '<b>This browser has no WebUSB.</b> Open the page in Chrome, Edge or another Chromium browser to use a real instrument. The demo works everywhere.';
  else if (!window.isSecureContext) envEl.innerHTML = '<b>WebUSB needs a secure page</b> (https:// or a file opened from disk). The demo still works.';
  else envEl.textContent = 'Plug the i1 Pro straight into a USB port (not a hub) and close spotread/ArgyllCMS first: only one program can own the instrument.';
  function status(msg, cls) { const s = g('i1p-status'); s.textContent = msg; s.className = 'status ' + (cls || ''); if (window.I1P_onStatus) { try { window.I1P_onStatus(msg, cls || ''); } catch (e) { } } }
  function note(msg, cls) { const s = g('ms-msg'); s.textContent = msg; s.className = 'status ' + (cls || ''); }
  const BUSYIDS = ['i1p-dark', 'i1p-meas', 'i1p-white', 'i1p-connect', 'i1p-demo', 'i1p-disc', 'i1p-rcal', 'i1p-acal', 'i1p-badd', 'i1p-bfit', 'i1p-eeload', 'i1p-eereset', 'i1p-live', 'i1p-m-em', 'i1p-m-rf'];
  function setBusy(b) { busy = b; for (const id of BUSYIDS) g(id).disabled = b; if (!b) { eeButtons(); } if (window.I1P_onBusy) { try { window.I1P_onBusy(b); } catch (e) { } } }
  function shown(c) { g('i1p-ctl').hidden = !c; g('i1p-disc').hidden = !c; g('i1p-connect').hidden = c; g('i1p-demo').hidden = c; }
  function explain(e) {
    const m = e && e.message || String(e);
    if (e && e.name === 'NotFoundError') return 'No instrument chosen.';
    if (/Access denied|SecurityError|claimInterface|Unable to claim/i.test(m)) return 'The system refused access to the USB device. Add a udev rule (Linux setup, in Advanced settings), re-plug the instrument and close spotread.';
    if (e && (e.code === 'TIMEOUT' || e.code === 'RECOVER')) return m + ' Advanced settings → Instrument info → "Copy diagnostic log" has the details.';
    return m;
  }

  /* ---------- preferences (kept in this browser) ---------- */
  const PREF = ['i1p-exm', 'i1p-tgt', 'i1p-maxauto', 'i1p-reuse', 'i1p-mt', 'i1p-rt', 'i1p-res', 'i1p-lo', 'i1p-hi', 'i1p-step', 'i1p-kern', 'i1p-wscale', 'i1p-fwhm', 'i1p-interp',
    'i1p-lrt', 'i1p-am', 'i1p-wn', 'i1p-keep', 'i1p-livesnap', 'i1p-n', 'i1p-int', 'i1p-each', 'i1p-rk', 'i1p-rT', 'i1p-ak', 'i1p-av', 'i1p-ap', 'i1p-aw', 'i1p-ah', 'i1p-aa', 'i1p-pkn', 'i1p-pkp', 'i1p-pkv', 'i1p-inst', 'i1p-btn', 'i1p-auto', 'i1p-autorec', 'ms-norm', 'i1p-log10', 'i1p-ma', 'i1p-mb'];
  function savePrefs() { const o = {}; for (const id of PREF) { const e = g(id); if (e) o[id] = e.type === 'checkbox' ? e.checked : e.value; } lstore.set('i1p-prefs', JSON.stringify(o)); }
  function loadPrefs() { try { const o = JSON.parse(lstore.get('i1p-prefs') || '{}'); for (const id of PREF) { const e = g(id); if (e && id in o) { if (e.type === 'checkbox') e.checked = !!o[id]; else e.value = o[id]; } } } catch (e) { } }

  /* ---------- resolution presets ---------- */
  const PRE = I1Pro.RES_PRESETS;
  if (!PRE.some(p => p.id === 'narrow1')) PRE.splice(3, 0, { id: 'narrow1', label: 'LED lines: 1 nm, ArgyllCMS interpolation (narrowest, recommended for LED spectra)', opts: { lo: 380, hi: 730, step: 1, kernel: 'argyll', argyllWidth: 1 } });
  g('i1p-res').innerHTML = PRE.map(p => '<option value="' + p.id + '">' + esc(p.label) + '</option>').join('');
  function activePreset() {
    const id = g('i1p-res').value, p = PRE.find(x => x.id === id) || PRE[0];
    if (p.id !== 'custom') return { id: p.id, label: p.label, opts: Object.assign({ interp: 'lagrange', widthScale: 1 }, p.opts) };
    return { id: 'custom', label: 'custom grid', opts: { lo: num('i1p-lo', 380), hi: num('i1p-hi', 730), step: Math.max(0.1, num('i1p-step', 1)), kernel: g('i1p-kern').value, widthScale: num('i1p-wscale', 1), fwhm: num('i1p-fwhm', 0), interp: g('i1p-interp').value } };
  }
  function shortRes() { const p = activePreset(); return p.id === 'std10' ? '10 nm' : p.id === 'hires3' ? '3.33 nm' : p.id === 'fine1' ? '1 nm' : p.id === 'narrow1' ? '1 nm LED lines' : (+p.opts.step.toFixed(2)) + ' nm custom'; }
  function resUi() {
    const p = activePreset(); g('i1p-custom').hidden = p.id !== 'custom';
    const f = g('i1p-kern').value === 'factory'; g('i1p-wscale-f').hidden = !f; g('i1p-fwhm-f').hidden = f; g('i1p-fwhm-l').textContent = g('i1p-kern').value === 'argyll' ? 'Triangle half-width nm (0 = grid step)' : 'FWHM nm (0 = factory)';
    const n = Math.round((p.opts.hi - p.opts.lo) / p.opts.step) + 1; let t = n + ' points per spectrum. ';
    if (p.id === 'std10') t += 'Exactly the 36 bands ArgyllCMS reports.';
    else if (p.id === 'hires3') t += 'The grid of ArgyllCMS high-resolution mode (-H), with the same filter algorithm (cubic interpolation of the pixels integrated against a 3.33 nm triangle). The optical resolution is about 6.5 nm: narrow peaks get sharper, noise gets larger.';
    else if (p.id === 'narrow1') t += 'Cubic interpolation of the 128 pixels with a 1 nm triangle: no extra smoothing, so narrow LED lines keep the width the optics give them (about 10 nm for a 5 nm line) and their colour coordinates stay closest to the truth. Noise is the same as with the wider kernels.';
    else t += 'Finer than the sensor pixel spacing (about 3.1-3.6 nm, depending on wavelength) is interpolation, not extra information.';
    g('i1p-resnote').textContent = t; sumUi();
  }
  g('i1p-kcmp').onclick = () => {
    const m = MS.list.find(x => x.id === MS.sel), out = g('i1p-kcmpn');
    if (!m || m.kind !== 'em') { out.textContent = 'Select a light measurement in the table first.'; return; }
    const c = calFor(m.eeId); if (!c) { out.textContent = 'The calibration of that measurement is not available.'; return; }
    const K = [['factory (36 bands)', { kernel: 'factory' }], ['ArgyllCMS 1 nm', { kernel: 'argyll', argyllWidth: 1 }], ['ArgyllCMS 3.33 nm', { kernel: 'argyll', argyllWidth: 10 / 3 }], ['sinc 5 nm', { kernel: 'sinc', fwhm: 5 }], ['Gaussian 8 nm', { kernel: 'gaussian', fwhm: 8 }]];
    const corr = (m.corr || m.absK) ? Float64Array.from({ length: 36 }, (_, i) => (m.corr ? m.corr[i] : 1) * (m.absK || 1)) : null, css = getComputedStyle(document.documentElement), ser = [], rows = [];
    K.forEach(([name, o], i) => {
      const rs = I1Pro.buildResampler(c.cal, c.fits, Object.assign({ lo: 380, hi: 730, step: 1, interp: 'lagrange', widthScale: 1, corr }, o)), wl = Array.from(rs.wl), v = Array.from(rs.apply(Float64Array.from(m.avgAbs))), mx = Math.max(...v), ip = v.indexOf(mx);
      let l = ip, r = ip; while (l > 0 && v[l] > mx / 2) l--; while (r < v.length - 1 && v[r] > mx / 2) r++;
      let area = 0; for (const x of v) area += x; const mn = Math.min(...v);
      ser.push({ x: wl, y: g('ms-norm').checked ? v.map(x => x / mx) : v, color: css.getPropertyValue('--k' + (i + 1)).trim() || '#2a78d6', width: 1.6, name });
      rows.push(name + ': peak ' + wl[ip] + ' nm, width of the main peak ' + (r - l) + ' nm, power ' + (area * 1).toPrecision(4) + (mn < -0.005 * mx ? ', negative lobes ' + (100 * mn / mx).toFixed(1) + '%' : ''));
    });
    spTitle = 'kernel comparison of ' + m.name; g('ms-title').textContent = 'Kernel comparison'; g('ms-legend').innerHTML = ser.map(s => '<span><i class="dot" style="background:' + s.color + '"></i>' + esc(s.name) + '</span>').join('');
    spPlot.set(ser, [], [380, 730]); out.innerHTML = rows.map(esc).join('<br>') + '<br><i>Click a row of the table to go back. Narrow lines show the difference; for broad spectra all kernels agree.</i>';
  };
  g('i1p-res').onchange = () => { resUi(); refreshAll(); }; g('i1p-kern').onchange = () => { resUi(); refreshAll(); };
  for (const id of ['i1p-lo', 'i1p-hi', 'i1p-step', 'i1p-wscale', 'i1p-fwhm', 'i1p-interp']) g(id).onchange = () => { resUi(); refreshAll(); };

  /* ---------- plots ---------- */
  const spPlot = new Plot(g('i1p-cv'), { h: 260, fmtX: x => x.toFixed(1), unitX: ' nm', title: () => spTitle });
  spPlot.dom = [380, 780]; let spTitle = '';
  const pxPlot = new Plot(g('i1p-cv2'), { h: 140, fmtX: x => 'pixel ' + Math.round(x), fmtTick: x => String(Math.round(x)), title: 'sensor pixels 0–127, counts/s (blue end = 127)' }); pxPlot.dom = [-1, 128];
  const tPlot = new Plot(g('i1p-cvT'), { h: 200, fmtX: x => x.toFixed(1), unitX: ' s', from0: false, fmtTick: x => String(+x.toFixed(1)) });
  root.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-z]'); if (!b) return; const z = b.dataset.z, P = z[0] === 'T' ? tPlot : spPlot, k = z.slice(1);
    if (k === '+') P.zoomCenter(0.6); else if (k === '-') P.zoomCenter(1.6); else P.resetView();
  });
  g('i1p-log10').onchange = () => { spPlot.log = g('i1p-log10').checked; spPlot.draw(); };
  g('ms-norm').onchange = () => drawMain();

  /* ---------- calibration lookup (so stored measurements can be re-processed without the instrument) ---------- */
  function fnv(u8) { let h = 0x811c9dc5; for (let i = 0; i < u8.length; i++) { h ^= u8[i]; h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); }
  const toB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 4096) s += String.fromCharCode.apply(null, u8.subarray(i, i + 4096)); return btoa(s); };
  const fromB64 = b => { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
  function eeRegister() { const id = dev.cal.serial + '-' + fnv(dev.eeprom); if (!EE[id]) EE[id] = toB64(dev.eeprom); dev.eeId = id; return id; }
  function calFor(id) {

  /* ---------- connect ---------- */
  async function attach(transport, isSim) {
    setBusy(true); status('Opening instrument…');

      dev = new I1Pro.I1ProDevice(transport, { log: m => console.log('[i1pro]', m), autoRecover: g('i1p-autorec').checked });

    const rs = I1Pro.buildResampler(s.cal, I1Pro.fitAllBands(s.cal), { lo: 380, hi: 730, step: 1, kernel: 'factory' }), flat = rs.apply(Float64Array.from({ length: 128 }, () => 1));
    let mean = 0; for (const x of flat) mean += x / flat.length;
    s.o.sens = nm => { const k = Math.min(350, Math.max(0, nm - 380)), i = Math.floor(k), f = k - i; return mean / (flat[i] * (1 - f) + flat[Math.min(350, i + 1)] * f); };
  }

  function bbUi() {
    const tb = g('i1p-btab').querySelector('tbody'), an = +g('i1p-bas').value || 0;
    tb.innerHTML = bbList.map((x, i) => '<tr><td>' + (i + 1) + '</td><td>' + (x.est ? x.est + ' K' : '–') + '</td><td>' + Math.round(x.peak) + '</td><td>' + (bbRes ? Math.round(bbRes.T[i]) + ' K' : '–') + '</td><td>' + (bbRes && bbRes.gauge === 'anchor' && bbRes.anchorIndex === i ? '●' : '') + '</td></tr>').join('');
    g('i1p-bas').innerHTML = bbList.map((_, i) => '<option value="' + i + '">' + (i + 1) + '</option>').join(''); g('i1p-bas').value = String(Math.min(an, Math.max(0, bbList.length - 1)));
    g('i1p-bclr').disabled = !bbList.length; g('i1p-bfit').disabled = bbList.length < 3; g('i1p-buse').disabled = !bbRes;
  }
  g('i1p-badd').onclick = async () => {
    if (!dev || busy) return; setBusy(true);
    try { status('Measuring…'); if (sim) sim.mode = 'emission'; const r = await dev.measure(mopts({ reuse: false, count: 0 })); bbList.push({ est: num('i1p-bt', 0) || null, s36: Array.from(r.s36raw), peak: r.peakCounts }); bbRes = null; g('i1p-binfo').textContent = bbList.length + ' step(s) captured.' + (bbList.length < 3 ? ' Add at least ' + (3 - bbList.length) + ' more.' : ''); status('Temperature step ' + bbList.length + ' captured.', 'ok'); }
    catch (e) { status(explain(e), 'err'); }
    setBusy(false); bbUi(); infoPanel();
  };
  g('i1p-bclr').onclick = () => { bbList = []; bbRes = null; g('i1p-binfo').textContent = ''; bbUi(); };
  g('i1p-bfit').onclick = () => {
    try {
      const at = num('i1p-ban', 0), ai = +g('i1p-bas').value || 0;
      const res = I1Pro.fitBlackbodyTemperatures(bbList.map(x => ({ v: x.s36, T0: x.est || undefined })), { lo: num('i1p-blo', 430), hi: num('i1p-bhi', 710), anchorIndex: at > 0 ? ai : -1, anchorT: at > 0 ? at : 0 });
      res.anchorIndex = ai; bbRes = res; const d = res.T.map((T, i) => i ? ' · step ' + (i + 1) + ' vs 1: ' + (res.T[i] - res.T[0] > 0 ? '+' : '') + Math.round(res.T[i] - res.T[0]) + ' K' : '').join('');
      g('i1p-binfo').innerHTML = 'Fitted: <b>' + res.T.map(T => Math.round(T) + ' K').join(', ') + '</b> (residual ' + (res.resid * 100).toFixed(2) + '% rms over ' + res.nBands + ' bands, ' + res.lo + '–' + res.hi + ' nm).' + (res.gauge === 'anchor'
        ? ' Anchored: step ' + (ai + 1) + ' = ' + at + ' K.' : ' <b>No anchor:</b> the steps between the temperatures are exact, but the absolute values assume the factory colour calibration and a grey emitter (typical error a few percent). Enter the true temperature of one step to fix them.') + (res.resid > 0.02 ? ' The residual is large: the lamp may not be a thermal emitter, or the light changed between steps.' : '');
      bbUi();
    } catch (e) { g('i1p-binfo').textContent = explain(e); }
  };
  g('i1p-buse').onclick = () => {
    if (!dev || !bbRes) return; const T = Math.round(bbRes.T.reduce((a, b) => a + b, 0) / bbRes.T.length);
    srcMeta = { kind: 'blackbody, ' + bbRes.T.length + '-temperature fit' + (bbRes.gauge === 'anchor' ? ' (anchored)' : ''), T: undefined, date: Date.now(), lo: bbRes.lo, hi: bbRes.hi, serial: dev.cal.serial };
    dev.setCorrection(bbRes.corr, true, srcMeta); corrUi(); infoPanel(); status('The correction from the temperature series is ON for the next light measurements.', 'ok');
  };
  g('i1p-bas').onchange = () => { bbRes = null; bbUi(); }; bbUi();

  /* ---------- EEPROM ---------- */
  const sameEE = () => origEE && dev && dev.eeprom.length === origEE.length && dev.eeprom.every((b, i) => b === origEE[i]);
  function eeButtons() { g('i1p-eereset').disabled = busy || !dev || !origEE || sameEE(); }
  function eeInfo() { if (!dev) return; g('i1p-eeinfo').textContent = (sameEE() ? 'Using the instrument\'s own calibration' : 'Using an IMPORTED calibration (not the instrument\'s own)') + ' · serial ' + dev.cal.serial + ' · ' + dev.eeprom.length + ' bytes.'; eeButtons(); }
  g('i1p-eebin').onclick = () => dev && download('i1pro-eeprom-' + dev.cal.serial + '.bin', dev.eeprom, 'application/octet-stream');
  g('i1p-eehex').onclick = () => dev && download('i1pro-eeprom-' + dev.cal.serial + '.txt', I1Pro.eepromToHexDump(dev.eeprom), 'text/plain');
  g('i1p-eeload').onclick = () => g('i1p-eefile').click();
  g('i1p-eefile').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f || !dev) return; setBusy(true);
    try {
      const buf = new Uint8Array(await f.arrayBuffer()), head = buf.subarray(0, 400); let ascii = 0; for (const b of head) if ((b >= 32 && b < 127) || b === 10 || b === 13 || b === 9) ascii++;
      const u8 = ascii > head.length * 0.97 ? I1Pro.parseEEPROMText(new TextDecoder().decode(buf)) : buf;
      if (u8.length < 0x1e08) throw new Error('That file holds only ' + u8.length + ' bytes; at least ' + 0x1e08 + ' are needed.');
      dev.loadEEPROM(u8); eeRegister(); hist = []; timeCard(); live = null; eeInfo(); infoPanel(); exposureUi(); chips(); corrUi();
      status('Calibration loaded from ' + f.name + ' (serial ' + dev.cal.serial + '). Dark and white calibrations were cleared: repeat them.', 'ok');
    } catch (er) { status('Could not load calibration: ' + (er.message || er), 'err'); }
    setBusy(false);
  };
  g('i1p-eereset').onclick = () => { if (!dev || !origEE) return; dev.loadEEPROM(Uint8Array.from(origEE)); eeRegister(); eeInfo(); infoPanel(); exposureUi(); chips(); status('Back to the instrument\'s own calibration. Repeat the dark and white calibrations.', 'ok'); };

  /* ---------- tab show / resize / start ---------- */
  for (const id of ['i1p-pkn', 'i1p-pkp', 'i1p-pkv']) g(id).onchange = () => renderAll();
  root.addEventListener('change', e => { if (e.target.id && PREF.includes(e.target.id)) savePrefs(); });
  window.I1P_debug = { get dev() { return dev; }, get sim() { return sim; } };   // for tests and the console
  window.I1P_onShow = () => requestAnimationFrame(() => { try { renderAll(); drawTime(); showCorr(); } catch (e) { console.warn(e); } });
  addEventListener('resize', () => { try { if (!root.hidden) { for (const p of Plot.all) p.draw(); showCorr(); } } catch (e) { } });
    if (!lstore.get('i1p-prefs')) g('i1p-res').value = 'narrow1';
    loadPrefs(); resUi(); exposureUi(); srcUi(); g('i1p-wn-f').hidden = g('i1p-am').value !== 'roll'; spPlot.log = g('i1p-log10').checked;
  window.I1P_api = {
    get dev() { return dev; }, get sim() { return sim; }, get busy() { return busy; }, get mode() { return mode; }, get liveOn() { return liveOn; },
    setBusy, status, note, mopts, activePreset, procSpectrum, makeMeasurement, warnings, calFor, lab1nm, liveLab1nm, absUi, corrUi, infoPanel, chips, exposureUi,
    doMeasure, renderAll, refreshAll, MS, EE, lstore, nextName, uniqueName, addMeasurement, shortRes, explain, num: id => num(id, 0)
  };
  shown(false); renderAll(); loadSaved();
  };

</script>
<script>window.LSL_GUIDE="<h1>LED Spectrum Lab: user guide<\/h1>\n<p>LED Spectrum Lab is two single-file web pages that share one database in your browser:<\/p>\n<table>\n<thead>\n<tr>\n<th>Page<\/th>\n<th>Job<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>measure.html<\/strong><\/td>\n<td>Connect the i1 Pro (or the demo), calibrate, take measurements, put them into groups. Shows the full analysis of what you just measured.<\/td>\n<\/tr>\n<tr>\n<td><strong>lab.html<\/strong><\/td>\n<td>Analyse, compare and plot everything that was measured. Also the LED library and mixer of the original Lab.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Both pages show the same analysis tabs. Open both from the <strong>same folder / web address in the same browser profile<\/strong>: they update each other within a second or two, so you can measure on one screen and watch CRI, TM-30, spectrum and colour on the other.<\/p>\n<hr />\n<h2 id=\"quickstart\">1. Quick start<\/h2>\n<ol>\n<li>Open <code>measure.html<\/code> in <strong>Chrome or Edge<\/strong> (WebUSB exists only in Chromium browsers). The page must be <code>https://<\/code>, <code>localhost<\/code> or a local file.<\/li>\n<li>Press <strong>Connect i1 Pro<\/strong> and choose the instrument, or press <strong>Demo<\/strong> (a simulator, no hardware needed).<\/li>\n<li>Cover the sensor (cap on, or lay the instrument on a dark surface) and press <strong>Dark calibration<\/strong> (about 5 s).<\/li>\n<li>In the <strong>Group<\/strong> card type a name, the LED / device name, the <strong>current (mA)<\/strong> and <strong>voltage (V)<\/strong> (and temperature if you like).<\/li>\n<li>Point the instrument at the LED and press <strong>\u25cf Measure<\/strong> (or the space bar, or the button on the instrument). Set \"\u00d7 N shots\" first to repeat the measurement; all N shots land in the group and their mean is the group's result.<\/li>\n<li>Look at the tabs (Overview, Spectrum, CIE, CRI, TM-30 \u2026). Everything is computed from the active group, live.<\/li>\n<li>For the next operating point press <strong>Next condition<\/strong>: it starts a new group with the same LED and asks for the next current.<\/li>\n<li>On <code>lab.html<\/code> (or the <strong>Measurements<\/strong>, <strong>Overlay<\/strong> and <strong>X\u2013Y plots<\/strong> tabs) compare the groups: spectra on top of each other, or any quantity against any other (flux vs current, Duv vs flux, peak wavelength vs temperature \u2026).<\/li>\n<\/ol>\n<blockquote>\n<p><strong>Back up your data.<\/strong> Everything lives in the browser's database. Use <em>Measurements \u2192 Export \u2192 All measurements (.json)<\/em> regularly.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"how\">2. How it works<\/h2>\n<h3 id=\"how-groups\">2.1 Shot \u2192 group \u2192 analysis<\/h3>\n<ul>\n<li>A <strong>shot<\/strong> is one reading of the instrument: a spectrum from 380 to 730 nm on a 1 nm grid (spectral irradiance, mW/m\u00b2/nm), plus the 128 raw sensor pixel values and the instrument settings (integration time, frames, peak counts, calibration used, kernel used).<\/li>\n<li>A <strong>group<\/strong> collects shots that belong together, normally <strong>repeats of the same measurement<\/strong>, to average out noise. It also carries the <em>operating point<\/em>: LED name, current, voltage, power, temperature, tags, a note, and any extra fields you define.<\/li>\n<li><strong>A group is shown as one measurement<\/strong>: its spectrum is the mean of its <em>included<\/em> shots. You can untick a shot (outlier) to leave it out of the mean, or look at a single shot. Nothing is ever deleted unless you delete it.<\/li>\n<li>The standard deviation of the shots is kept and used as <strong>error bars<\/strong> in the X\u2013Y plots.<\/li>\n<li>All analysis (CCT, Duv, CRI, TM-30, photometry, melanopic \u2026) is done on the <strong>mean spectrum<\/strong> of the group by the same engine that analyses library LEDs.<\/li>\n<\/ul>\n<h3 id=\"how-store\">2.2 Two pages, one store<\/h3>\n<p>Both pages use the IndexedDB database <code>led-spectrum-lab-measurements<\/code>. Changes are announced between tabs (BroadcastChannel, the <code>storage<\/code> event, and a 2 s poll as fallback). The header chip \"saved in this browser\" shows that the database is available. If it says <em>NOT saved<\/em> the browser blocks the database (private window?): export your data manually.<\/p>\n<h3 id=\"how-units\">2.3 Units, flux factor G and the 380\u2013730 nm range<\/h3>\n<p>The i1 Pro measures <strong>irradiance at its sensor<\/strong> (mW/m\u00b2/nm), not the total light of an LED.<\/p>\n<ul>\n<li>Without extra information the tool reports <strong>illuminance in lux<\/strong> (where the Lab says \"lm\") and <strong>irradiance in mW/m\u00b2<\/strong> (where it says \"mW\"). A banner on the overview says so.<\/li>\n<li>To get <strong>lumens and watts<\/strong> of the LED itself, set the <strong>flux factor G (m\u00b2)<\/strong>: total flux = irradiance \u00d7 G. Choose in <em>Measurements \u2192 Flux conversion<\/em>: Lambertian source at distance d (G = \u03c0\u00b7d\u00b2), isotropic (4\u03c0\u00b7d\u00b2), or a custom value. A single group can override the global setting. In a goniometer or integrating sphere set G from your calibration.<\/li>\n<li><strong>Efficacy (lm/W)<\/strong> needs electrical power. If you enter current and voltage, power = I \u00d7 V is used. If G is unknown the tool uses <em>illuminance per watt<\/em> (lx/W) instead, which is fine to compare operating points of the same LED at the same distance.<\/li>\n<li>The instrument covers <strong>380\u2013730 nm<\/strong>. Outside that the spectrum is treated as zero. For red LEDs with a long tail, tick <strong>\"extend falling red tail to 780 nm\"<\/strong> in the Measurements tab. It continues an obviously falling tail with an exponential decay before CRI, TM-30 and lumens are computed. Deep-red and far-red LEDs beyond 730 nm cannot be measured.<\/li>\n<\/ul>\n<h3 id=\"how-kernel\">2.4 From 128 pixels to a spectrum: the kernel<\/h3>\n<p>The i1 Pro has <strong>128 pixels<\/strong>, 3.1\u20133.6 nm apart; each pixel sees a band 6\u201310 nm wide. The spectrum you see is a weighted sum of the pixels: the weights are the <strong>kernel<\/strong>. Finer than the pixel spacing is interpolation, not extra information: a 5 nm LED line always looks about 10 nm wide.<\/p>\n<table>\n<thead>\n<tr>\n<th>Kernel / preset<\/th>\n<th>When to use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>LED lines: 1 nm, ArgyllCMS interpolation<\/strong> (default)<\/td>\n<td>Best for LED spectra: no extra smoothing, closest colour for narrow lines.<\/td>\n<\/tr>\n<tr>\n<td>Standard 10 nm (36 bands)<\/td>\n<td>Exactly the ArgyllCMS / spotread numbers.<\/td>\n<\/tr>\n<tr>\n<td>High resolution 3.33 nm<\/td>\n<td>ArgyllCMS <code>-H<\/code> grid.<\/td>\n<\/tr>\n<tr>\n<td>Fine 1 nm (factory)<\/td>\n<td>The 36 factory bands interpolated: widest kernel, makes narrow lines about 14 nm wide and shifts their colour (a 525 nm line: \u0394x +0.004, \u0394y \u22120.008). Fine for broadband light.<\/td>\n<\/tr>\n<tr>\n<td>Custom<\/td>\n<td>Any grid and kernel: ArgyllCMS filter, factory, windowed sinc, triangle, Gaussian; width and interpolation.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Tested with simulated lights: every kernel preserves power within about 1 %, noise is the same, broad phosphor LEDs agree to \u0394x,\u0394y &lt; 0.0005 whatever you choose. The Instrument tab's <strong>Compare kernels<\/strong> button draws one of your own measurements with five kernels. The 128 raw pixel values are stored with every shot, so the original data is never lost.<\/p>\n<h3 id=\"how-cal\">2.5 Calibrations<\/h3>\n<table>\n<thead>\n<tr>\n<th>Calibration<\/th>\n<th>What it does<\/th>\n<th>When<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Dark<\/strong><\/td>\n<td>Subtracts the sensor's dark signal (modelled from two readings, valid for any exposure).<\/td>\n<td>Before every session; again after 20\u201330 min or when the room temperature changes. Required.<\/td>\n<\/tr>\n<tr>\n<td><strong>Source (black-body) correction<\/strong><\/td>\n<td><em>Shape<\/em> calibration: you measure a lamp of known colour temperature (tungsten halogen about 2856 K, or your own reference CSV) and the tool derives a multiplier per band so that the instrument shows that shape. Scale-free; applies to later measurements while ON.<\/td>\n<td>When you want to correct a colour tilt of the instrument. Limited by how good the lamp is (100 K off the rated temperature = a colour tilt in every measurement).<\/td>\n<\/tr>\n<tr>\n<td><strong>Black-body at several temperatures<\/strong><\/td>\n<td>For a lamp whose temperature you can change but not know exactly. Capture \u2265 3 temperatures, fit; optionally enter the true temperature of one step (anchor). Can be used as source correction.<\/td>\n<td>Calibration without a certified lamp. The steps in 1/T are exact; the absolute values need an anchor.<\/td>\n<\/tr>\n<tr>\n<td><strong>Absolute level<\/strong><\/td>\n<td>One factor for the whole spectrum: from a luminance (cd/m\u00b2) or irradiance meter, from a laser line (power and beam area) or entered directly. <strong>Match lux meter<\/strong> (measure page, quick settings) does the same from an illuminance reading.<\/td>\n<td>When you need real lux / mW/m\u00b2.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Corrections only affect <strong>new<\/strong> measurements. Each shot records which correction and kernel it was taken with.<\/p>\n<h3 id=\"how-calc\">2.6 What is calculated<\/h3>\n<p>Colorimetry on the CIE 1931 2\u00b0 and 1964 10\u00b0 observers (1 nm grid); CCT and Duv from the nearest point of the Planckian locus in CIE 1960 uv; CRI (CIE 13.3-1995, R1\u2013R14); TM-30-20 (Rf, Rg, hue-bin metrics, 99 CES); photometry (photopic, scotopic); alpha-opic and melanopic quantities (CIE S 026, DER and EDI); photon flux (PPF 400\u2013700 nm, ePAR 400\u2013750 nm); spectral quality (SSI, band coverage, smoothness, narrowest peak). Treat the results as engineering estimates and check them against calibrated references for anything that matters.<\/p>\n<hr />\n<h2 id=\"measure\">3. The measure page<\/h2>\n<h3 id=\"m-instrument\">3.1 Instrument card<\/h3>\n<p>Connect / Demo / Disconnect, the <strong>Dark calibration<\/strong> button and the age of the dark calibration, small chips that show whether the <strong>source correction<\/strong> and <strong>absolute level<\/strong> are on and which <strong>kernel<\/strong> is used, and a shortcut to <strong>Calibration &amp; settings<\/strong> (the Instrument tab). The status line shows what the instrument is doing.<\/p>\n<h3 id=\"m-measure\">3.2 Measure card<\/h3>\n<ul>\n<li><strong>\u25cf Measure \u00d7 N shots<\/strong>: N separate shots into the active group. <strong>Stop<\/strong> ends a series.<\/li>\n<li><strong>\u25b6 Live<\/strong>: continuous readings (averaging time from <em>Quick settings<\/em>); the analysis shows the live spectrum (\"Live preview, not saved\"). <strong>Save live shot<\/strong> keeps the current spectrum in the group.<\/li>\n<li><strong>Quick settings<\/strong>: live averaging time, <strong>Match lux meter<\/strong> (enter the reading of a lux meter pointed at the same light, press the button: all future measurements are scaled).<\/li>\n<li><strong>Demo light<\/strong> (demo only): choose the simulated LED and its drive current. Type the same current into the group to make plots.<\/li>\n<li>Exposure, averaging time, targets and everything else are set in the <strong>Instrument<\/strong> tab and apply to every shot.<\/li>\n<\/ul>\n<p>Shortcuts: <strong>Space<\/strong> measures (when no field has the focus); the <strong>button on the instrument<\/strong> measures too.<\/p>\n<h3 id=\"m-group\">3.3 Group card<\/h3>\n<p>Choose the active group, <strong>+ New<\/strong> (empty group) or <strong>Next condition<\/strong> (same LED, voltage, temperature, tags; type the next current). Fill in <em>group name, LED / device, current, voltage, temperature, electrical power, flux factor G, tags, note<\/em> and any own fields (e.g. \"supply\", \"heatsink\"). The list shows the latest shots with include checkboxes, <strong>\u25ce<\/strong> (show this shot alone) and <strong>\u2715<\/strong> (delete); <strong>Undo last shot<\/strong> removes the newest; <strong>Show group mean<\/strong> returns to the mean.<\/p>\n<h3 id=\"m-instrument-tab\">3.4 The Instrument tab<\/h3>\n<p>The complete original i1 Pro console:<\/p>\n<ul>\n<li><strong>Light / Pigment<\/strong> mode (pigments use the instrument's own lamp and a white-tile calibration; they stay in the console).<\/li>\n<li><strong>Advanced settings<\/strong>: exposure (auto with target counts and longest time, or manual integration time), <em>Resolution and output<\/em> (presets, custom grid, kernel, width, interpolation; <strong>Compare kernels<\/strong>), <em>Live recording and averaging<\/em> (rolling or cumulative mean, update interval, time plots, CSV), <em>Calibrate against a known source<\/em>, <em>Calibrate the absolute level<\/em>, <em>Blackbody at several temperatures<\/em>, <em>Calibration data (EEPROM)<\/em> (export, import, back to the instrument's own), <em>Readout and display<\/em> (peak labels, valleys), <em>Instrument info and diagnostics<\/em>, Linux setup.<\/li>\n<li>The console has its own <strong>measurement table<\/strong> (tick rows to draw, rename by double-click, export CSV / .sp / ArgyllCMS values / JSON). With the option <em>\"Also add every measurement made here to the active group\"<\/em> (on by default) light measurements taken in the console also become shots of the active group. <strong>Add to active group<\/strong> sends ticked rows later; <strong>Analyse \u25b8<\/strong> shows one in the Lab's analysis.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"analysis\">4. The analysis tabs<\/h2>\n<p>All tabs analyse the <strong>Source<\/strong> chosen in the header (live preview, the active group, the latest shot, any group, an LED or the mix). The <strong>Illuminance (lx)<\/strong> field sets the level for the melanopic EDI of LED sources.<\/p>\n<table>\n<thead>\n<tr>\n<th>Tab<\/th>\n<th>Shows<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Overview<\/strong><\/td>\n<td>KPI cards (CCT, Duv, CRI, TM-30, flux, efficacy, melanopic DER, SSI \u2026), spectrum and chromaticity.<\/td>\n<\/tr>\n<tr>\n<td><strong>Spectrum<\/strong><\/td>\n<td>The spectrum in mW/nm, \u00b5mol/s/nm or normalised, log axis, fill, overlay of V(\u03bb), V\u2032(\u03bb), melanopic and cone curves; <strong>Auto labels<\/strong> for peaks and valleys; zoom with the wheel, pan by dragging, double-click resets.<\/td>\n<\/tr>\n<tr>\n<td><strong>CIE diagram<\/strong><\/td>\n<td>Chromaticity in xy or u\u2032v\u2032 (2\u00b0 or 10\u00b0), the Planckian locus, point table.<\/td>\n<\/tr>\n<tr>\n<td><strong>CRI<\/strong><\/td>\n<td>R1\u2013R14 bars and the test-colour table.<\/td>\n<\/tr>\n<tr>\n<td><strong>TM-30<\/strong><\/td>\n<td>Colour vector graphic, Rf,h, Rcs,h, Rhs,h, the 99 CES and the hue-bin table.<\/td>\n<\/tr>\n<tr>\n<td><strong>Spectral quality<\/strong><\/td>\n<td>SSI, band coverage, smoothness, peaks.<\/td>\n<\/tr>\n<tr>\n<td><strong>Photometry<\/strong><\/td>\n<td>Luminous, scotopic and radiant quantities, efficacy, band shares, photon flux.<\/td>\n<\/tr>\n<tr>\n<td><strong>Melanopic &amp; sensitivities<\/strong><\/td>\n<td>Alpha-opic irradiance, DER and EDI.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"compare\">4.1 Comparing two sources<\/h3>\n<p>Pick the second spectrum in the header: <strong>Compare<\/strong>. It can be <em>none<\/em>, the TM-30 reference illuminant, D65, illuminant A, the mix, any LED of the library <strong>or any measured group<\/strong>. Then:<\/p>\n<ul>\n<li><strong>Every tab<\/strong> gets a <strong>comparison table<\/strong> with the measurements of both sources side by side, A (analysed source, blue) and B (compare, grey), and the difference <strong>B \u2212 A<\/strong>: peak wavelength(s), peak width (FWHM), centroid, dominant wavelength, purity, CCT, Duv, x y, u\u2032 v\u2032, CRI, R9, TM-30 Rf / Rg, flux or illuminance, LER, S/P, melanopic DER and EDI, SSI, smoothness \u2026 The Overview lists all, other tabs the relevant ones. <strong>\u0394u\u2032v\u2032<\/strong> is the colour distance (about 0.002 is just visible side by side, 0.004\u20130.006 clearly visible). Hover a row for its meaning.<\/li>\n<li><strong>Charts show B too<\/strong>: dashed grey in the spectrum, a grey point in the CIE diagram, \u25c6 markers over the CRI, TM-30 and band bars, a dashed blue polygon in the TM-30 colour vector graphic.<\/li>\n<li>D65, A and the TM-30 reference are scaled to the lumens of A so they are directly comparable in the plot; measured groups and LEDs keep their own level.<\/li>\n<\/ul>\n<p>For a bigger picture of <strong>many<\/strong> groups at once use <em>Overlay<\/em> (spectra) and <em>X\u2013Y plots<\/em> (any quantity vs any other).<\/p>\n<h3 id=\"labels\">4.2 Auto labels<\/h3>\n<p>On the <em>Spectrum<\/em> and <em>Overlay<\/em> tabs the toolbar <strong>Auto labels<\/strong> marks <strong>peaks \u25b2<\/strong> and <strong>valleys \u25bc<\/strong> with their wavelength (sub-nanometre, parabola through the top) and optionally the height. <strong>Max<\/strong> is the number per trace, <strong>prominence %<\/strong> how far a peak or valley must stand out from its surroundings (relative to the highest point), <strong>min. spacing nm<\/strong> merges close labels, <strong>smooth nm<\/strong> averages before searching (raise it for noisy spectra). Valleys are searched only between the outermost peaks. By default only the main trace is labelled; <strong>all traces<\/strong> labels every trace (can be crowded). The Instrument tab's chart has the same (number, prominence, valleys).<\/p>\n<hr />\n<h2 id=\"library\">5. Measurements, Overlay and X\u2013Y plots<\/h2>\n<h3 id=\"t-meas\">5.1 Measurements tab<\/h3>\n<p>The list of all groups with CCT, illuminance, shot count and the operating point; tick rows to select them for the Overlay and X\u2013Y plots. Click a row to edit it on the right.<\/p>\n<ul>\n<li><strong>Edit<\/strong> name, LED, current, voltage, power, temperature, G, tags, note, extra fields (+ field adds your own, for example \"supply voltage\"; it becomes a metric you can plot).<\/li>\n<li><strong>Shots<\/strong> of the group: include/exclude, move to another group (for example a mis-assigned shot), delete.<\/li>\n<li><strong>Make active<\/strong> sends new measurements to this group; <strong>Analyse \u25b8<\/strong> shows it in the analysis tabs; <strong>\u2192 LED library<\/strong> adds the mean spectrum to the LED library (so it can be used in mixes; asks for the flux if G is unknown).<\/li>\n<li><strong>Import\u2026<\/strong> / <strong>Export<\/strong>: JSON with everything (groups, shots, raw pixels), summary CSV of all groups, spectra CSV. <strong>Merge<\/strong> combines ticked groups into one (all shots are kept); <strong>Delete<\/strong> removes groups and their shots.<\/li>\n<\/ul>\n<h3 id=\"t-overlay\">5.2 Overlay<\/h3>\n<p>Spectra of the ticked groups on top of each other, plus their chromaticity. <strong>Scale<\/strong>: absolute, normalised to peak, equal illuminance (100 lx) or equal power, to compare shape or level. <strong>Individual shots<\/strong> shows the shots behind each mean. Use it to see how peak wavelength and shape change with current or temperature.<\/p>\n<h3 id=\"t-xy\">5.3 X\u2013Y plots<\/h3>\n<p>Any quantity against any other, one point per group (the mean of its shots).<\/p>\n<ul>\n<li><strong>Quick plots<\/strong>: flux vs current, efficacy vs current, Duv vs flux, CCT vs current, CRI vs current, peak \u03bb vs current / temperature, flux vs temperature \u2026<\/li>\n<li><strong>X / Y / Y2<\/strong>: any metric: set-up fields (current, voltage, power, temperature, your own fields), light output, efficacy, colour (CCT, Duv, x, y, u\u2032, v\u2032, dominant \u03bb), spectrum (peak \u03bb, FWHM), CRI R1\u2013R14, TM-30, circadian. Y2 adds a right-hand axis.<\/li>\n<li><strong>Curves per<\/strong> LED / first tag / one curve. <strong>Normalise Y<\/strong> to the maximum or to the first point (for example droop curves). Lines, markers, <strong>error bars<\/strong> (\u00b11\u03c3 of the shots), group names, log axes, Y from 0.<\/li>\n<li>Click a point to select its group in the Measurements tab. <strong>PNG<\/strong> and <strong>CSV<\/strong> export the plot and its data.<\/li>\n<li>Needs the relevant fields: efficacy needs current and voltage (or power); lumens need G. The message above the plot says what is missing.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"lab\">6. The LED library and the mixer<\/h2>\n<p>The original Lab on <code>lab.html<\/code>: a library of LEDs (the built-in ones are <strong>synthetic<\/strong>, replace them with measured spectra), create one with <strong>+ New LED<\/strong> (peak wavelength and width, or a CCT for a white pc-LED, or import a CSV), add LEDs to the <strong>mix<\/strong> with \uff0b and set quantity, drive current and scale per channel; the mix is analysed like any source. <em>Export<\/em> writes library, mix or LED as <code>.json<\/code>; spectra can be imported as CSV (wavelength, intensity). Flux is assumed linear in current with no thermal shift.<\/p>\n<hr />\n<h2 id=\"files\">7. Files and backup<\/h2>\n<table>\n<thead>\n<tr>\n<th>File<\/th>\n<th>Content<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Measurements JSON<\/td>\n<td>groups, shots, raw pixels, settings; re-importable (Import\u2026).<\/td>\n<\/tr>\n<tr>\n<td>Summary CSV<\/td>\n<td>one row per group with all metrics.<\/td>\n<\/tr>\n<tr>\n<td>Spectra CSV<\/td>\n<td>the mean spectra of the groups.<\/td>\n<\/tr>\n<tr>\n<td>Console exports<\/td>\n<td>CSV (chosen resolution), <code>.sp<\/code> (ArgyllCMS), ArgyllCMS values (36 bands, 3.33 nm), pixels CSV, JSON of the console table, EEPROM <code>.bin<\/code> / hex.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"trouble\">8. Troubleshooting<\/h2>\n<table>\n<thead>\n<tr>\n<th>Problem<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"No WebUSB\"<\/td>\n<td>Use Chrome or Edge on desktop.<\/td>\n<\/tr>\n<tr>\n<td>\"Access denied / unable to claim\"<\/td>\n<td>Close ArgyllCMS / spotread or another tab; Linux: install the udev rule (<code>udev/55-i1pro.rules<\/code>) and re-plug; Windows: bind WinUSB (for example with Zadig).<\/td>\n<\/tr>\n<tr>\n<td>Timeout<\/td>\n<td>The driver resets and retries once. Use a short cable, no hub. <em>Instrument tab \u2192 Advanced \u2192 Instrument info \u2192 Copy diagnostic log<\/em>.<\/td>\n<\/tr>\n<tr>\n<td>\"Saturated\"<\/td>\n<td>Move away from the light, shorten a manual integration time, lower the auto target.<\/td>\n<\/tr>\n<tr>\n<td>\"Frames varied\" / flicker<\/td>\n<td>PWM-dimmed light: use a longer averaging time or several shots.<\/td>\n<\/tr>\n<tr>\n<td>Weak signal<\/td>\n<td>Move closer, longer <em>Longest auto time<\/em>.<\/td>\n<\/tr>\n<tr>\n<td>Lab page does not update<\/td>\n<td>Open both pages from the same address (same folder) in the same browser profile; \"saved in this browser\" must show in the header.<\/td>\n<\/tr>\n<tr>\n<td>Numbers in lx / mW/m\u00b2 instead of lm / mW<\/td>\n<td>Set the flux factor G (see 2.3).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"limits\">9. Limits<\/h2>\n<ul>\n<li>The i1 Pro Rev A\u2013D is supported (not i1Pro 2 / Rev E). Reflective mode, live mode, the instrument button and the absolute scale have so far only been tested against the simulator.<\/li>\n<li>The instrument covers 380\u2013730 nm; optical resolution is about 6.5 nm; widths of narrow lines are broader than real.<\/li>\n<li>The absolute scale of the factory calibration is assumed (mW/m\u00b2/nm), not verified. Calibrate against a reference for real numbers.<\/li>\n<li>Source correction cannot be better than the lamp. A tilt of the instrument's colour response cannot be told apart from a shift of all temperatures without an anchor temperature.<\/li>\n<li>Flux is irradiance \u00d7 G: geometry (distance, angle, diffuser) must be the same as at calibration.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"glossary\">10. Glossary<\/h2>\n<ul>\n<li><strong>CCT<\/strong>: correlated colour temperature, the temperature of the black body that looks most like the light (meaningful only near the locus).<\/li>\n<li><strong>Duv<\/strong>: distance from the Planckian locus; + greenish, \u2212 pinkish.<\/li>\n<li><strong>CRI Ra / R9<\/strong>: colour rendering index (mean of 8 samples / saturated red). Unreliable for narrow-band LEDs.<\/li>\n<li><strong>TM-30 Rf / Rg<\/strong>: fidelity and gamut indices; <strong>Rcs,h1<\/strong> the red chroma shift.<\/li>\n<li><strong>LER<\/strong>: lumens per watt of radiated power. <strong>WPE<\/strong>: radiant power / electrical power.<\/li>\n<li><strong>Melanopic DER / EDI<\/strong>: melanopic efficacy relative to D65 / the equivalent D65 illuminance.<\/li>\n<li><strong>FWHM<\/strong>: full width at half maximum of a peak.<\/li>\n<li><strong>\u0394u\u2032v\u2032<\/strong>: colour difference in the CIE 1976 diagram.<\/li>\n<li><strong>Shot<\/strong>: one reading. <strong>Group<\/strong>: shots of one condition, shown as their mean.<\/li>\n<\/ul>";

<script>/* LED Spectrum Lab - help text for the measurement workflow
 * SPDX-License-Identifier: AGPL-3.0-or-later */

      h('li', null, h('b', null, 'Two pages, one store: '), 'measure.html takes the measurements, lab.html analyses them. Both keep their data in the same browser database (IndexedDB) and update each other within a moment, so you can measure on one screen and watch CRI, TM-30, spectrum and colour on the other. Open both from the same place (same folder or the same web address) in the same browser profile.'),
      h('li', null, h('b', null, 'Instrument tab (measure page): '), 'the complete original i1 Pro console. Source (black-body) correction against a tungsten lamp or your own reference CSV, black-body at several temperatures (fit the true temperatures, use as correction), absolute level (cd/m², mW/m², laser line, factor), resolution presets and custom kernels (ArgyllCMS, factory, sinc, triangle, Gaussian, interpolation), exposure control, live averaging and time plots, pigments (reflective mode with white-tile calibration), EEPROM backup/import and diagnostics. Whatever is set there is used for every shot taken with the Measure button; measurements made in the console itself are added to the active group too (switchable).'),

      h('li', null, h('b', null, 'Shot → group: '), 'every press of Measure adds a shot to the active group. The group is shown as ONE measurement (the mean spectrum of its included shots); tick/untick shots to leave outliers out, or open the group to see every individual shot. Nothing is thrown away.'),
      h('li', null, h('b', null, 'Operating point: '), 'give the group a name, the LED it belongs to, current (mA), voltage (V), temperature (°C), notes and any fields of your own. You can also do this later on the analysis page. "Next condition" starts a new group with the same LED and asks for the next current.'),
